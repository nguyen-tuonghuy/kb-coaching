<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kinball Coach · Vidéos</title>
<link rel="icon" type="image/png" href="kinball-brand/favicon.png">
<style>
:root{
  --bg:#F3F6FA;--panel:#FFFFFF;--panel2:#F7F9FC;--line:#CBD5E1;--text:#172033;--muted:#53657A;
  --primary:#2563EB;--accent:#2563EB;--good:#18794E;--warn:#B45309;--bad:#B42318;
  --nav:#0F172A;--nav2:#1E293B;--navLine:#334155;--focus:#93C5FD;
}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,select{font:inherit}button,a.button{border:1px solid var(--line);border-radius:12px;background:#171c24;color:var(--text);padding:10px 13px;text-decoration:none;cursor:pointer}
button:hover,a.button:hover{border-color:#587197}.hidden{display:none!important}.small{font-size:12px;color:var(--muted);line-height:1.45}
.shell{max-width:1180px;margin:0 auto;padding:18px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.brand{font-size:22px;font-weight:800}
.topActions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.homeIcon{min-width:48px;padding-left:12px!important;padding-right:12px!important;display:inline-flex!important;align-items:center;justify-content:center}.status{display:inline-flex;align-items:center;gap:7px;border-radius:999px;background:#1e2530;padding:8px 11px;font-size:13px}.dot{width:9px;height:9px;border-radius:50%;background:var(--good)}
.panel{border:1px solid var(--line);border-radius:20px;background:var(--panel);padding:16px}.header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.header h1{margin:2px 0 2px;font-size:25px}
.toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin:16px 0}.field{display:grid;gap:5px;min-width:280px;flex:1}.field label{font-size:12px;color:var(--muted)}
select{width:100%;border:1px solid var(--line);border-radius:11px;background:#121720;color:var(--text);padding:10px 11px}
.summary{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 16px}.chip{border:1px solid var(--line);border-radius:999px;background:#151b24;padding:7px 10px;font-size:12px}.chip.unread{border-color:#6e5431;color:#ffd49b}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:12px}.card{border:1px solid var(--line);border-radius:16px;background:var(--panel2);padding:14px;display:grid;gap:10px;min-width:0}
.card.unread{border-color:#725638;box-shadow:inset 0 0 0 1px #725638}.cardHead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.card h3{margin:0;font-size:18px}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800;background:#242c38;color:var(--muted);white-space:nowrap}.badge.unread{background:#4e3626;color:#ffd2a1}
.latest{border-top:1px solid var(--line);padding-top:9px;min-height:55px}.latest strong{display:block;font-size:13px;margin-bottom:3px;overflow-wrap:anywhere}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions a{flex:1;text-align:center;font-weight:750}
.empty{border:1px dashed var(--line);border-radius:14px;padding:18px;color:var(--muted);text-align:center}.error{color:#ffc4c8}
@media(max-width:680px){.shell{padding:10px}.panel{padding:12px}.field{min-width:100%}.grid{grid-template-columns:1fr}.header h1{font-size:22px}}

.startupScreen{position:fixed;inset:0;z-index:99999;background:#0f1217;color:#f4f6f8;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.startupScreenInner{text-align:center}.startupScreenBrand{font-size:24px;font-weight:800;margin-bottom:8px}.startupScreenText{font-size:13px;color:#9aa5b4}


/* KC UX BATCH 2026-09-26 */
html,body{background:var(--bg);color:var(--text)}
.topbar{
  background:var(--nav);color:#F8FAFC;padding:10px 12px;border-radius:16px;
  box-shadow:0 6px 18px rgba(15,23,42,.12)
}
.topbar .status{background:var(--nav2);color:#F8FAFC;border:1px solid var(--navLine)}
.topbar button,.topbar a.button{background:#111827;color:#F8FAFC;border-color:var(--navLine)}
.topbar button:hover,.topbar a.button:hover{background:#1E293B;border-color:#475569}
button,a.button{background:#fff!important;color:var(--text)!important;border-color:var(--line)!important}
button:hover,a.button:hover{background:#EEF3F8!important;border-color:#AAB8CA!important}
select{background:#fff!important;color:var(--text)!important;border-color:var(--line)!important}
.panel{box-shadow:0 1px 2px rgba(15,23,42,.04)}
.chip{background:#E9EEF5;color:#41546D}
.chip.unread{background:#FFF1DD;color:#7A4A08;border-color:#E2B86B}
.card{background:#F8FAFC}
.card.unread{border-color:#D7A95C;box-shadow:inset 0 0 0 1px #E9C98C}
.badge{background:#E9EEF5;color:#41546D}
.badge.unread{background:#FFF1DD;color:#7A4A08}
.actions a{background:#fff!important;color:#1E478F!important}
.error{color:#B42318!important}
.startupScreen{background:var(--nav)!important;color:#F8FAFC!important}
.startupScreenText{color:#CBD5E1!important}


/* KC UX BATCH 2 2026-09-26 — light application chrome */
.topbar{background:#FFFFFF!important;color:var(--text)!important;border:1px solid var(--line)!important;padding:10px 12px;border-radius:16px;box-shadow:0 1px 3px rgba(15,23,42,.06)!important}
.topbar .status{background:#ECFDF3!important;color:#17633E!important;border:1px solid #B7E4C7!important}
.topbar button,.topbar a.button{background:#FFFFFF!important;color:var(--text)!important;border-color:var(--line)!important}
.topbar button:hover,.topbar a.button:hover{background:#F8FAFC!important;border-color:#94A3B8!important}
.startupScreen{background:var(--bg)!important;color:var(--text)!important}
.startupScreenInner{background:#FFFFFF;border:1px solid var(--line);border-radius:18px;padding:24px 28px;box-shadow:0 12px 34px rgba(15,23,42,.10)}
.startupScreenText{color:var(--muted)!important}

/* Kinball Coach — identité visuelle 2026 */
:root{
  --brand-navy:#0B315B;--brand-pink:#F4267D;--brand-blue:#1768B3;--brand-teal:#0AA89E;--brand-yellow:#FFB62E;
  --bg:#F6F8FB;--panel:#FFFFFF;--panel2:#F8FAFC;--text:#172033;--muted:#627083;--line:#D5DCE5;
  --accent:#1768B3;--primary:#1768B3;--nav:#0B315B;--nav2:#164A7A;--navLine:#2D5D89;--focus:#8DB9E8;
}
.kcBrand{display:inline-flex;align-items:center;gap:8px;min-width:0}
.kcBrandMark{width:44px;height:34px;display:block;flex:0 0 auto;object-fit:contain}
.kcBrandWord{display:inline-flex;align-items:baseline;gap:4px;font-family:ui-rounded,"Avenir Next","Segoe UI",system-ui,sans-serif;font-size:21px;font-weight:850;letter-spacing:-.5px;white-space:nowrap;line-height:1}
.kcBrandKin{color:var(--brand-navy)}.kcBrandCoach{color:var(--brand-pink)}
.kcAuthBrand{display:flex;justify-content:center;align-items:center;margin:2px 0 18px;padding:12px 8px 18px;border-bottom:1px solid var(--line)}
.kcAuthLogo{display:block;width:min(460px,100%);height:auto;max-width:100%}
.kcBrandLarge{gap:14px}.kcBrandLarge .kcBrandMark{width:92px;height:66px}.kcBrandLarge .kcBrandWord{font-size:32px;gap:7px}
.startupScreenBrand{color:var(--brand-navy)!important}.startupScreenBrand .kcStartupCoach{color:var(--brand-pink)}
button.primary,.primary,.on,.tab.active{background:var(--brand-blue)!important;border-color:var(--brand-blue)!important;color:#fff!important}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--brand-blue) 35%,transparent);outline-offset:2px}
.dangerAction{color:#8F241E!important;border-color:#E3AAA7!important;background:#FFF7F6!important}
.dangerAction:hover{background:#FFF0EF!important;border-color:#D88E89!important}
#count{display:none!important}
@media(max-width:560px){
  .top,.topbar{flex-wrap:wrap;align-items:flex-start;gap:7px 9px}
  .kcBrand{gap:5px;flex:0 1 auto;max-width:100%}
  .kcBrandMark{width:30px;height:24px}
  .kcBrandWord{font-size:15px;gap:2px;letter-spacing:-.35px}
  .topActions{flex:1 1 210px;min-width:0;justify-content:flex-end;gap:6px}
  .topActions button,.topActions a.button{padding:8px 10px}
  .topActions .badge,.topActions .status{padding:7px 9px;font-size:12px}
  .kcBrandLarge{gap:10px}.kcBrandLarge .kcBrandMark{width:72px;height:54px}.kcBrandLarge .kcBrandWord{font-size:25px}.kcAuthLogo{width:min(320px,100%)}
}



/* KC loading screen — logo seul, centre exact */
.startupScreenInner{display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;background:transparent!important;border:0!important;border-radius:0!important;padding:0!important;box-shadow:none!important;min-width:120px;min-height:120px}
.kcStartupLogo{display:block;width:118px;height:auto;aspect-ratio:320/262;object-fit:contain;max-width:32vw}
.kcStartupText{margin-top:10px;font-size:13px;font-weight:650;letter-spacing:.01em;color:var(--muted);line-height:1.2;white-space:nowrap}
@media(max-width:560px){.kcStartupLogo{width:96px;max-width:38vw}.kcStartupText{margin-top:8px;font-size:12px}}


/* KC identité — passe esthétique finale */
.kcBrand{gap:7px;flex:0 0 auto;min-width:0}
.kcBrandMark{width:40px;height:32px;object-fit:contain;object-position:center}
.kcBrandWord{font-size:19px;gap:3px;letter-spacing:-.42px}
.kcAuthBrand{margin:0 auto 16px;padding:4px 8px 14px;min-height:0}
.kcAuthLogo{width:min(250px,58vw);height:auto;max-width:100%;filter:drop-shadow(0 3px 8px rgba(11,49,91,.06))}
.kcStartupLogo{width:112px;max-width:30vw;filter:drop-shadow(0 5px 12px rgba(11,49,91,.08))}
@media(max-width:560px){
  .top,.topbar{display:grid!important;grid-template-columns:auto minmax(0,1fr);align-items:center!important;gap:7px 10px!important}
  .kcBrand{gap:5px;align-self:center;max-width:max-content}
  .kcBrandMark{width:27px;height:22px}
  .kcBrandWord{font-size:14.5px;gap:2px;letter-spacing:-.28px}
  .topActions{min-width:0!important;max-width:100%;justify-content:flex-end!important;align-items:center!important;gap:5px!important;flex-wrap:wrap!important}
  .topActions button,.topActions a.button{min-height:38px;padding:7px 9px!important}
  .topActions .badge,.topActions .status{min-height:36px;padding:6px 8px!important;font-size:11.5px!important}
  .kcAuthBrand{margin-bottom:13px;padding:2px 4px 12px}
  .kcAuthLogo{width:min(190px,56vw)}
  .kcStartupLogo{width:92px;max-width:34vw}
}
@media(max-width:390px){
  .top,.topbar{grid-template-columns:1fr!important}
  .topActions{grid-column:1/-1;justify-content:flex-start!important;width:100%}
  .kcBrand{justify-self:start}
}

</style>
</head>
<body>
<div class="startupScreen" id="startupScreen" role="status" aria-label="Chargement de Kinball Coach"><div class="startupScreenInner"><img class="kcStartupLogo" width="320" height="262" src="kinball-brand/logo-symbol.png" alt="" aria-hidden="true"><div class="kcStartupText">Chargement…</div></div></div>

<div class="shell">
  <div class="topbar">
    <div class="kcBrand" aria-label="Kinball Coach"><img class="kcBrandMark" src="kinball-brand/logo-symbol.png" alt="" aria-hidden="true"><span class="kcBrandWord"><span class="kcBrandKin">Kinball</span><span class="kcBrandCoach">Coach</span></span></div>
    <div class="topActions">
      <span class="status"><span class="dot"></span><span id="cloudText">Connexion…</span></span>
      <a class="button homeIcon" href="index.html" aria-label="Accueil" title="Accueil"><svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" style="display:block">
  <path d="M3 11.2 12 4l9 7.2v8.3a.5.5 0 0 1-.5.5H15v-6H9v6H3.5a.5.5 0 0 1-.5-.5v-8.3Z" fill="currentColor"/>
</svg></a>
      <button id="logout">Déconnexion</button>
    </div>
  </div>

  <main class="panel">
    <div class="header">
      <div>
        <div class="small">Espace entraîneur</div>
        <h1>🎥 Vidéos</h1>
        <div class="small">Accès direct aux vidéos déposées par les joueurs.</div>
      </div>
      <a class="button" href="index.html">← Accueil</a>
    </div>

    <div class="toolbar">
      <div class="field">
        <label>Groupe</label>
        <select id="groupSelect"><option value="">Chargement…</option></select>
      </div>
      <button id="refreshBtn">↻ Actualiser</button>
    </div>

    <div id="summary" class="summary"></div>
    <div id="status" class="small"></div>
    <section id="playerGrid" class="grid"><div class="empty">Chargement…</div></section>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://chrbzchthloxowlzdvpe.supabase.co';
const SUPABASE_KEY='sb_publishable_4pQGJ5DSzMRBuHLrAUb30g_MGZVYvEY';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const params=new URLSearchParams(location.search);
let groups=[],currentGroup='',rows=[];

function fmtDate(v){
  if(!v)return'';
  try{return new Date(v).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}
  catch{return String(v)}
}
function setStatus(t,err=false){const e=$('#status');e.textContent=t||'';e.className='small'+(err?' error':'')}
function render(){
  const totalPlayers=rows.length;
  const totalVideos=rows.reduce((s,r)=>s+Number(r.total_videos||0),0);
  const unread=rows.reduce((s,r)=>s+Number(r.unread_videos||0),0);
  $('#summary').innerHTML=`<span class="chip">${totalPlayers} joueur${totalPlayers>1?'s':''}</span><span class="chip">${totalVideos} vidéo${totalVideos>1?'s':''}</span>${unread?`<span class="chip unread">${unread} nouvelle${unread>1?'s':''} pour toi</span>`:''}`;
  const box=$('#playerGrid');
  if(!rows.length){box.innerHTML='<div class="empty">Aucun joueur actif dans ce groupe.</div>';return}
  box.innerHTML=rows.map(r=>{
    const n=Number(r.total_videos||0),u=Number(r.unread_videos||0);
    const title=r.latest_title||r.latest_file_name||'';
    const latest=n?`<div class="latest"><span class="small">Dernière vidéo</span><strong>${esc(title||'Vidéo')}</strong><span class="small">${esc(fmtDate(r.latest_uploaded_at))}</span></div>`:`<div class="latest"><span class="small">Aucune vidéo synchronisée.</span></div>`;
    const href=`videos.html?group=${encodeURIComponent(currentGroup)}&player=${encodeURIComponent(r.player_id)}`;
    return `<article class="card ${u?'unread':''}">
      <div class="cardHead"><div><h3>${esc(r.player_name)}</h3><div class="small">${n} vidéo${n>1?'s':''}</div></div>${u?`<span class="badge unread">${u} nouvelle${u>1?'s':''}</span>`:'<span class="badge">À jour</span>'}</div>
      ${latest}
      <div class="actions"><a class="button" href="${href}">Voir les vidéos</a></div>
    </article>`;
  }).join('');
}
async function loadDashboard(){
  if(!currentGroup){rows=[];render();return}
  setStatus('Chargement…');
  const {data,error}=await db.rpc('get_coach_video_dashboard',{p_group_id:currentGroup});
  if(error){setStatus(error.message||String(error),true);return}
  rows=data||[];render();setStatus('');
}
async function init(){
  const {data:{session}}=await db.auth.getSession();
  if(!session?.user){location.href='index.html';return}
  $('#cloudText').textContent='Synchronisé';
  const {data,error}=await db.from('coaching_groups').select('id,name').order('name');
  if(error)throw error;
  groups=data||[];
  const select=$('#groupSelect');
  select.innerHTML=groups.length?groups.map(g=>`<option value="${esc(g.id)}">${esc(g.name)}</option>`).join(''):'<option value="">Aucun groupe</option>';
  const requested=params.get('group');
  currentGroup=(requested&&groups.some(g=>g.id===requested)?requested:groups[0]?.id)||'';
  select.value=currentGroup;
  select.onchange=()=>{currentGroup=select.value;history.replaceState(null,'',currentGroup?`coach-videos.html?group=${encodeURIComponent(currentGroup)}`:'coach-videos.html');loadDashboard()};
  await loadDashboard();
}
$('#refreshBtn').onclick=()=>loadDashboard();
$('#logout').onclick=async()=>{if(!confirm('Voulez-vous vraiment vous déconnecter ?'))return;await db.auth.signOut();location.href='index.html'};
init().catch(e=>setStatus(e.message||String(e),true)).finally(()=>document.getElementById('startupScreen')?.remove());
</script>
</body>
</html>
