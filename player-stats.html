<script>

const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function sameOriginReferrer(){
  try{return document.referrer && new URL(document.referrer).origin===location.origin}catch{return false}
}
function referrerFile(){
  try{return new URL(document.referrer).pathname.split('/').pop()||'index.html'}catch{return ''}
}
function returnToIndexWithoutReload(){
  if(sameOriginReferrer() && (referrerFile()==='index.html' || referrerFile()==='')){
    history.back();
    return;
  }
  location.href='index.html';
}


const state={user:null,accesses:[],groupId:null,playerId:null,playerName:'',groupName:'',isCoach:false,matches:[],selected:[],scope:'all',restartLocation:'all',loading:false};

function err(e){return e?.message||String(e)||'Erreur'}
function formatDateShort(v){if(!v)return'';try{return new Date(v+'T12:00:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'2-digit'})}catch{return String(v)}}
function num(v){const n=Number(v);return Number.isFinite(n)?n:null}
function signed(v){const n=num(v);if(n==null)return'—';const x=Math.round(n*10)/10;return`${x>0?'+':''}${x.toFixed(1).replace('.',',')}`}
function pct(v){const n=num(v);if(n==null)return'—';return`${(Math.round(n*10)/10).toFixed(1).replace('.',',')} %`}
function impactClass(v){const n=num(v)||0;return n>.05?'positive':n<-.05?'negative':'neutral'}
function reliability(n){n=Number(n)||0;if(n<5)return{cls:'low',label:'Très faible'};if(n<=15)return{cls:'limited',label:'Limité'};return{cls:'ok',label:''}}
function scopeLabel(s){return s==='center'?'Jeu au centre':s==='restart_center'?'Remise en jeu · centre':s==='restart_line'?'Remise en jeu · ligne':s==='restart_corner'?'Remise en jeu · coin':s==='restart'?'Remise en jeu · toutes':'Cumulé'}
function contextLabel(c){return({game_center:'Jeu au centre',restart_center:'Remise · centre',restart_line:'Remise · ligne',restart_corner:'Remise · coin'})[c]||c}
function effectiveScope(){if(state.scope!=='restart')return state.scope||'all';const l=state.restartLocation||'all';return l==='center'?'restart_center':l==='line'?'restart_line':l==='corner'?'restart_corner':'restart'}

function takeaways(x,n){
  n=Number(n)||0;const creation=num(x?.creation100),safety=num(x?.safety100),items=[];
  if(n<5){items.push('Le volume est trop faible pour interpréter Création et Sécurité comme un niveau établi.');items.push('Le principal objectif pour l’instant est d’accumuler davantage d’actions analysées.')}
  else{
    if(n<=15)items.push('Le volume donne une première tendance seulement : quelques actions peuvent encore modifier nettement les scores.');
    const describe=(value,positive,neutral,negative)=>value==null?null:value>=3?positive:value<=-3?negative:neutral;
    const c=describe(creation,'Tu marques plus de points que ce que le référentiel prévoit pour les situations que tu as jouées.','Ton nombre de points marqués est proche de ce que le référentiel prévoit pour les situations que tu as jouées.','Tu marques moins de points que ce que le référentiel prévoit pour les situations que tu as jouées.');
    const s=describe(safety,'Ta sécurité offensive est au-dessus du référentiel : tu fais moins de fautes qu’attendu.','Ta sécurité offensive est proche du référentiel sur la sélection actuelle.','La réduction des fautes ressort comme un axe de travail sur la sélection actuelle.');
    if(c)items.push(c);if(s)items.push(s)
  }
  return`<div class="takeaways"><h4>À retenir</h4>${items.slice(0,3).map(t=>`<div class="takeaway"><span class="takeawayDot"></span><span>${esc(t)}</span></div>`).join('')}</div>`
}
function warning(n){n=Number(n)||0;if(n<5)return`<div class="warning critical"><strong>⚠ Très faible volume (N = ${n}).</strong> Ces scores peuvent varier fortement avec une seule action et ne doivent pas être interprétés comme un niveau établi.</div>`;if(n<=15)return`<div class="warning"><strong>⚠ Volume encore limité (N = ${n}).</strong> Les scores donnent une première tendance mais restent sensibles à quelques actions.</div>`;return''}
function detailsHtml(details){
  const map=Object.fromEntries((details||[]).map(d=>[d.context,d])),contexts=['game_center','restart_center','restart_line','restart_corner'];
  return`<details open><summary>Détail par situation</summary><div class="small" style="margin:0 0 8px">Jeu au centre et remises en jeu séparés. Le référentiel est indiqué sous tes taux.</div><div class="tableWrap"><table class="table"><thead><tr><th>Situation</th><th>N</th><th>% points</th><th>% fautes</th><th>Création /100</th><th>Sécurité /100</th></tr></thead><tbody>${contexts.map(c=>{const d=map[c]||{},n=Number(d.n)||0;return`<tr><td>${esc(contextLabel(c))}</td><td>${n}</td><td>${n?`<div>${pct(d.point_rate)}</div><div class="small">Réf. ${pct(d.expected_point_rate)}</div>`:'—'}</td><td>${n?`<div>${pct(d.fault_rate)}</div><div class="small">Réf. ${pct(d.expected_fault_rate)}</div>`:'—'}</td><td class="${impactClass(d.creation100)}">${n?signed(d.creation100):'—'}</td><td class="${impactClass(d.safety100)}">${n?signed(d.safety100):'—'}</td></tr>`}).join('')}</tbody></table></div></details>`
}
function sheet(data,allDetails){
  const x=data?.metrics||{},avg=data?.group_average||{},n=Number(x.n)||0,ref=data?.reference_version||'référence active',rel=reliability(n);
  return`<div class="sheet"><div class="sheetHeader"><div><div class="analysisSubtle">${esc(scopeLabel(effectiveScope()))}</div><h3>${esc(data.player_name||'')}</h3></div></div>${data?.is_test_mirror?`<div class="testNotice">Profil de test : les statistiques affichées sont une copie de celles de ${esc(data.stats_source_player_name||'un joueur source')} afin de tester un profil complet.</div>`:''}<div class="counts"><div class="count"><span>Nombre de frappes</span><strong>${n}</strong>${rel.label?`<span class="reliability">${esc(rel.label)}</span>`:''}</div><div class="count"><span>Points marqués</span><strong>${Number(x.points)||0}</strong></div><div class="count"><span>Fautes</span><strong>${Number(x.faults)||0}</strong></div></div>${warning(n)}${takeaways(x,n)}<div class="mainMetrics"><div class="metric"><span>Création /100</span><strong class="${impactClass(x.creation100)}">${n?signed(x.creation100):'—'}</strong><small>Moyenne groupe ${signed(avg.creation100)}</small></div><div class="metric"><span>Sécurité /100</span><strong class="${impactClass(x.safety100)}">${n?signed(x.safety100):'—'}</strong><small>Moyenne groupe ${signed(avg.safety100)}</small></div></div><div class="secondaryMetrics"><div class="secondary"><span>% points</span><strong>${n?pct(x.point_rate):'—'}</strong><small>${Number(x.points)||0} point${Number(x.points)===1?'':'s'} marqué${Number(x.points)===1?'':'s'} · Référentiel ${pct(x.expected_point_rate)} · Moyenne groupe ${pct(avg.point_rate)}</small></div><div class="secondary"><span>% fautes</span><strong>${n?pct(x.fault_rate):'—'}</strong><small>${Number(x.faults)||0} faute${Number(x.faults)===1?'':'s'} · Référentiel ${pct(x.expected_fault_rate)} · Moyenne groupe ${pct(avg.fault_rate)}</small></div></div><div class="small benchmark">La moyenne du groupe est calculée sans afficher les résultats des autres joueurs. Elle sert uniquement de repère collectif.</div><details open><summary>Comprendre le référentiel et les scores</summary><div class="explain"><p><strong>Le référentiel</strong> (${esc(ref)}) est construit à partir des attaques de la compétition de référence sélectionnées par le staff. Les données Hommes et Femmes sont séparées, ainsi que les différents contextes d’attaque.</p><div class="formula"><strong>Création /100</strong> : nombre de points produits en plus ou en moins sur 100 attaques par rapport au nombre attendu.</div><div class="formula"><strong>Sécurité /100</strong> : nombre de fautes évitées ou ajoutées sur 100 attaques par rapport au nombre attendu.</div><p>Un score de 0 correspond au niveau attendu du référentiel pour les situations réellement jouées. Positif = au-dessus du référentiel ; négatif = en dessous.</p><p>Le volume reste important : N &lt; 5 est trop faible pour conclure ; entre 5 et 15, le score donne surtout une tendance ; au-delà de 15 il devient plus stable.</p></div></details>${detailsHtml(allDetails||data.details||[])}</div>`
}

function opponentHtml(rows){
  const data=rows||[];
  if(!data.length){
    return `<div class="opponentBlock"><h4>Performance par adversaire</h4><div class="small">Aucune attaque exploitable avec adversaire renseigné sur la sélection actuelle.</div></div>`;
  }
  const body=data.map((r,idx)=>{
    const matches=Array.isArray(r.matches)?r.matches:[];
    const expandable=matches.length>1;
    const parent=`<tr class="opponentParentRow">
      <td>
        ${expandable
          ?`<div class="opponentToggle" data-opponent-toggle="${idx}"><span class="chev">▶</span><strong>${esc(r.opponent_name||'Adversaire')}</strong><span class="small">${matches.length} matchs</span></div>`
          :`<strong>${esc(r.opponent_name||'Adversaire')}</strong>`}
      </td>
      <td>${Number(r.n)||0}</td>
      <td>${Number(r.points)||0}</td>
      <td>${Number(r.faults)||0}</td>
      <td>${Number(r.defended)||0}</td>
      <td>${pct(r.point_rate)}</td>
      <td>${pct(r.fault_rate)}</td>
      <td class="${impactClass(r.creation100)}">${signed(r.creation100)}</td>
      <td class="${impactClass(r.safety100)}">${signed(r.safety100)}</td>
    </tr>`;
    const children=expandable?matches.map(mm=>`<tr class="opponentMatchRow hidden" data-opponent-child="${idx}">
      <td class="opponentMatchLabel">
        <strong>${esc(mm.match_label||'Match')}</strong>
        <span class="opponentMatchMeta">${esc(formatDateShort(mm.played_on)||'')}${mm.competition?' · '+esc(mm.competition):''}</span>
      </td>
      <td>${Number(mm.n)||0}</td>
      <td>${Number(mm.points)||0}</td>
      <td>${Number(mm.faults)||0}</td>
      <td>${Number(mm.defended)||0}</td>
      <td>${pct(mm.point_rate)}</td>
      <td>${pct(mm.fault_rate)}</td>
      <td class="${impactClass(mm.creation100)}">${signed(mm.creation100)}</td>
      <td class="${impactClass(mm.safety100)}">${signed(mm.safety100)}</td>
    </tr>`).join(''):'';
    return parent+children;
  }).join('');
  return `<div class="opponentBlock">
    <h4>Performance par adversaire</h4>
    <div class="small opponentIntro">Les mêmes filtres de matchs et de contexte s’appliquent. Quand un adversaire a été rencontré plusieurs fois, clique sur son nom pour afficher le détail de chaque match.</div>
    <div class="tableWrap"><table class="table">
      <thead><tr>
        <th>Adversaire</th><th>N</th><th>Points</th><th>Fautes</th><th>Défendus</th>
        <th>% points</th><th>% fautes</th><th>Création /100</th><th>Sécurité /100</th>
      </tr></thead>
      <tbody>${body}</tbody>
    </table></div>
  </div>`;
}
function bindOpponentBreakdowns(){
  document.querySelectorAll('[data-opponent-toggle]').forEach(el=>{
    el.onclick=()=>{
      const id=el.dataset.opponentToggle;
      const rows=document.querySelectorAll(`[data-opponent-child="${CSS.escape(id)}"]`);
      const opening=[...rows].some(r=>r.classList.contains('hidden'));
      rows.forEach(r=>r.classList.toggle('hidden',!opening));
      el.classList.toggle('open',opening);
    };
  });
}

function renderMatches(){
  const selected=new Set(state.selected||[]),box=$('#matches');
  box.innerHTML=(state.matches||[]).map(m=>`<label class="matchItem ${selected.has(m.id)?'checked':''}"><input type="checkbox" data-match="${esc(m.id)}" ${selected.has(m.id)?'checked':''}><span><strong>${esc(m.label||'Match')}</strong><span class="small">${esc(formatDateShort(m.played_on)||'Date ?')}${m.competition?' · '+esc(m.competition):''}</span></span></label>`).join('');
  $('#selectionStatus').textContent=`${selected.size} match${selected.size>1?'s':''} sélectionné${selected.size>1?'s':''}`;
  box.querySelectorAll('[data-match]').forEach(i=>i.onchange=()=>{const s=new Set(state.selected);i.checked?s.add(i.dataset.match):s.delete(i.dataset.match);state.selected=[...s];renderMatches();render().catch(showError)})
}
function args(ids,scope){return{p_group_id:state.groupId,p_match_ids:ids,p_scope:scope,p_player_id:state.isCoach?state.playerId:null}}
async function render(){
  const box=$('#content'),ids=state.selected||[];
  if(!ids.length){box.innerHTML='<div class="statsEmpty">Sélectionne au moins un match.</div>';return}
  if(state.loading)return;
  state.loading=true;
  box.innerHTML='<div class="statsEmpty">Calcul de tes statistiques…</div>';
  try{
    const scope=effectiveScope();
    const metricCalls=[
      db.rpc('get_player_portal_metrics',args(ids,scope)),
      db.rpc('get_player_portal_opponent_metrics',args(ids,scope))
    ];
    if(scope!=='all')metricCalls.push(db.rpc('get_player_portal_metrics',args(ids,'all')));
    const results=await Promise.all(metricCalls);
    results.forEach(r=>{if(r.error)throw r.error});
    const data=results[0].data||{};
    const opponents=results[1].data||[];
    const details=(scope!=='all'?(results[2]?.data||data):data).details||[];
    box.innerHTML=sheet(data,details)+opponentHtml(opponents);bindOpponentBreakdowns();
  }finally{state.loading=false}
}
function showError(e){console.error(e);$('#content').innerHTML=`<div class="statsEmpty error">${esc(err(e))}</div>`}

async function loadGroup(groupId){
  state.groupId=groupId;state.scope='all';state.restartLocation='all';
  const access=(state.accesses||[]).find(a=>a.group_id===groupId);const teamStatsLink=$('#teamStatsLink');if(teamStatsLink)teamStatsLink.classList.toggle('hidden',state.isCoach||access?.stats_access!=='group');
  $$('[data-scope]').forEach(b=>b.classList.toggle('active',b.dataset.scope==='all'));
  $('#restartField').classList.add('hidden');$('#restart').value='all';

  const [metricsRes,opponentsRes]=await Promise.all([
    db.rpc('get_player_portal_metrics',args(null,'all')),
    db.rpc('get_player_portal_opponent_metrics',args(null,'all'))
  ]);
  if(metricsRes.error)throw metricsRes.error;
  if(opponentsRes.error)throw opponentsRes.error;
  const data=metricsRes.data||{};
  state.matches=data?.matches||[];
  state.selected=state.matches.map(m=>m.id);
  state.playerName=data?.player_name||state.playerName;
  state.groupName=data?.group_name||state.groupName;
  $('#title').textContent=state.isCoach?`Statistiques · ${state.playerName}`:'Mes statistiques';
  $('#subtitle').textContent=state.groupName||'';
  renderMatches();
  $('#content').innerHTML=sheet(data,data?.details||[])+opponentHtml(opponentsRes.data||[]);bindOpponentBreakdowns();
  const q=state.isCoach?`?group=${encodeURIComponent(state.groupId)}&player=${encodeURIComponent(state.playerId)}`:`?group=${encodeURIComponent(state.groupId)}`;
  const videosLink=$('#videosLink');if(videosLink)videosLink.href='videos.html'+q
}
async function init(){
  const {data:{session}}=await db.auth.getSession();if(!session?.user){location.href='index.html';return}state.user=session.user;$('#cloudText').textContent='Synchronisé';
  const requestedGroup=params.get('group'),requestedPlayer=params.get('player');
  if(requestedGroup&&requestedPlayer){
    const {data,error}=await db.rpc('get_player_portal_metrics',{p_group_id:requestedGroup,p_match_ids:null,p_scope:'all',p_player_id:requestedPlayer});
    if(!error&&data?.player_id){state.isCoach=true;state.groupId=requestedGroup;state.playerId=requestedPlayer;state.playerName=data.player_name||'Joueur';state.groupName=data.group_name||'';$('#modeLabel').textContent='Vue entraîneur'}
  }
  if(!state.groupId){
    const {data,error}=await db.rpc('get_my_player_access');if(error)throw error;state.accesses=data||[];if(!state.accesses.length)throw new Error("Aucun espace joueur n'est lié à ce compte.");
    const chosen=(requestedGroup&&state.accesses.find(a=>a.group_id===requestedGroup))||state.accesses[0];state.groupId=chosen.group_id;state.playerId=chosen.player_id;state.playerName=chosen.player_name||'';state.groupName=chosen.group_name||'';
    if(state.accesses.length>1){$('#groupField').classList.remove('hidden');$('#groupSelect').innerHTML=state.accesses.map(a=>`<option value="${esc(a.group_id)}">${esc(a.group_name)} · ${esc(a.player_name)}</option>`).join('');$('#groupSelect').value=state.groupId;$('#groupSelect').onchange=()=>loadGroup($('#groupSelect').value).catch(showError)}
  }
  if(state.isCoach){const back=`index.html?staff_group=${encodeURIComponent(state.groupId)}&staff_player=${encodeURIComponent(state.playerId)}#player-home`;$('#nav').innerHTML=`<a href="${back}" id="statsBackPlayer" class="backNav">← ${esc(state.playerName)}</a><a href="index.html">Accueil entraîneur</a><a href="player-stats.html?group=${encodeURIComponent(state.groupId)}&player=${encodeURIComponent(state.playerId)}" class="active">Statistiques · ${esc(state.playerName)}</a><a href="videos.html?group=${encodeURIComponent(state.groupId)}&player=${encodeURIComponent(state.playerId)}" id="videosLink">Vidéos</a>`}
  await loadGroup(state.groupId)
}
$('#selectAll').onclick=()=>{state.selected=state.matches.map(m=>m.id);renderMatches();render().catch(showError)};
$('#latest').onclick=()=>{state.selected=state.matches[0]?.id?[state.matches[0].id]:[];renderMatches();render().catch(showError)};
$$('[data-scope]').forEach(b=>b.onclick=()=>{state.scope=b.dataset.scope;$$('[data-scope]').forEach(x=>x.classList.toggle('active',x===b));$('#restartField').classList.toggle('hidden',state.scope!=='restart');render().catch(showError)});
$('#restart').onchange=e=>{state.restartLocation=e.target.value;render().catch(showError)};
$('#logout').onclick=async()=>{if(!confirm('Voulez-vous vraiment vous déconnecter ?'))return;await db.auth.signOut();location.href='index.html'};
document.addEventListener('click',e=>{
  const link=e.target.closest?.('#statsHomeLink');
  if(!link)return;
  e.preventDefault();
  returnToIndexWithoutReload();
});
init().catch(showError).finally(()=>document.getElementById('startupScreen')?.remove());
</script>
</body>
</html>
